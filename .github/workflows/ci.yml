name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install dependencies
              run: npm install --no-audit --no-fund

            - name: Test
              run: npm test

            - name: Lint JS
              run: npm run lint

            - name: Check formatting
              run: npm run format:check

            - name: Lint HTML
              run: npx -y htmlhint index.html

            - name: Run tests
              run: npm test
